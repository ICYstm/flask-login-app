<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="login-container">
        <div class="tabs" id="tabHeader">
            <button id="loginTabBtn" class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button id="registerTabBtn" class="tab-btn" onclick="switchTab('register')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm">
            <h2>Welcome Back!</h2>
            <label for="loginEmail">Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email" required>

            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password" required>

            <button type="submit">Login</button>
            <p><a href="#" onclick="switchTab('reset')" class="link-text">Forgot Password?</a></p>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">
            <h2>Create Account</h2>
            <label for="regEmail">Email</label>
            <input type="email" id="regEmail" placeholder="Enter your email" required>

            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="Enter your password" required>

            <button type="submit">Sign Up</button>
        </form>

        <!-- Reset Password Form -->
        <form id="resetForm" class="hidden">
            <h2>Reset Password</h2>
            <label for="resetEmail">Email</label>
            <input type="email" id="resetEmail" placeholder="Registered email" required>

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" required>

            <button type="submit">Update Password</button>
            <p><a href="#" onclick="switchTab('login')" class="link-text">Back to Login</a></p>
        </form>

        <p id="message"></p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
